};
const EJES = Object.keys(CATEGORY_COLORS);
function categoryColor(eje) { return CATEGORY_COLORS[eje] || "#4a7fd6"; }

// ---- Progreso persistente (caja Leitner + último resultado) ----
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {};
}
let progress = loadProgress();
function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  if (currentUser) {
    setDoc(userDocRef(currentUser.uid), { progress, updatedAt: serverTimestamp() }, { merge: true })
      .catch(err => console.warn('No se pudo sincronizar el progreso con la nube:', err));
  }
}
function getEntry(id) {
  if (!progress[id]) progress[id] = { box: 1, result: null };
  return progress[id];
}

// ---- Historial de sesiones (para racha + progreso en el tiempo) ----
const HISTORY_KEY = "paes_historia_history_v1";
function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}
function pushHistory(entry) {
  const h = loadHistory();
  h.push(entry);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
  if (currentUser) {
    addDoc(historyColRef(currentUser.uid), entry)
      .catch(err => console.warn('No se pudo sincronizar el historial con la nube:', err));
  }
}
function dayKey(d) { return d.toISOString().slice(0, 10); }
function computeStreak(history) {
  if (history.length === 0) return 0;
  const days = new Set(history.map(h => h.date));
  let streak = 0;
  let cursor = new Date();
  // si hoy no hay sesión todavía, la racha se cuenta desde ayer hacia atrás
  if (!days.has(dayKey(cursor))) cursor.setDate(cursor.getDate() - 1);
  while (days.has(dayKey(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

// ---- Tabla oficial de conversión Puntaje P -> Puntaje PAES (Historia y Cs. Sociales, DEMRE) ----
const TABLA_PUNTAJE_PAES = [100,117,145,169,191,212,233,253,270,286,300,314,331,348,364,377,387,397,406,418,432,447,463,476,486,493,500,508,517,530,545,561,574,585,593,600,607,616,628,643,659,673,686,695,705,714,727,742,759,775,790,804,818,835,853,874,894,915,938,964,1000];
function puntajePAESProyectado(correctas, totalConsiderado) {
  // Escala proporcional a 60 preguntas (base oficial de la tabla)
  const p = Math.round((correctas / totalConsiderado) * 60);
  const idx = Math.max(0, Math.min(60, p));
  return TABLA_PUNTAJE_PAES[idx];
}

// ---- Diagnóstico inicial ----
const DIAG_KEY = "paes_historia_diag_done_v1";

// ==========================================================
// PANTALLA 1: SETUP
// ==========================================================
let setupEjes = new Set(EJES);
let setupDificultad = "mezcla";
let setupMode = "spaced";
let setupCount = 10;
let setupMinutes = 10;

function renderEjeChips() {
  document.getElementById('eje-chips').innerHTML = EJES.map(eje => `
    <button class="chip eje-chip ${setupEjes.has(eje) ? 'active' : ''}"
      data-eje="${eje}"
      style="${setupEjes.has(eje) ? `background:${categoryColor(eje)};border-color:${categoryColor(eje)}` : ''}">
      ${eje}
    </button>
  `).join('');
  document.querySelectorAll('.eje-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const eje = btn.dataset.eje;
      if (setupEjes.has(eje)) { if (setupEjes.size > 1) setupEjes.delete(eje); }
      else setupEjes.add(eje);
      renderEjeChips();
      updatePoolCount();
    });
  });
}

function currentPool() {
  return QUESTIONS.filter(q =>
    setupEjes.has(q.eje) &&
    (setupDificultad === "mezcla" || q.dificultad === setupDificultad)
  );
}

function updatePoolCount() {
  const n = currentPool().length;
  document.getElementById('pool-count').textContent = `${n} pregunta${n === 1 ? '' : 's'} disponibles con este filtro`;
  document.getElementById('start-btn').disabled = n === 0;
}

function setupChipGroup(containerId, onPick, initialVal) {
  const container = document.getElementById(containerId);
  container.querySelectorAll('.chip').forEach(btn => {
    if (btn.dataset.val === String(initialVal)) btn.classList.add('active');
    btn.addEventListener('click', () => {
      container.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      onPick(btn.dataset.val);
      updatePoolCount();
    });
  });
}

setupChipGroup('dificultad-chips', v => setupDificultad = v, setupDificultad);
setupChipGroup('count-chips', v => setupCount = parseInt(v), setupCount);
setupChipGroup('time-chips', v => setupMinutes = parseInt(v), setupMinutes);

document.querySelectorAll('.mode-more').forEach(el => {
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    let extra = el.nextElementSibling;
    if (!extra || !extra.classList.contains('mode-more-text')) {
      extra = document.createElement('span');
      extra.className = 'mode-more-text';
      extra.textContent = el.dataset.info;
      el.insertAdjacentElement('afterend', extra);
    }
    extra.classList.toggle('show');
  });
});

document.querySelectorAll('.mode-option').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-option').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setupMode = btn.dataset.mode;
    document.getElementById('config-fixed').style.display = (setupMode === 'fixed') ? 'block' : 'none';
    document.getElementById('config-timed').style.display = (setupMode === 'timed') ? 'block' : 'none';
  });
});
document.querySelector('.mode-option[data-mode="spaced"]').classList.add('active');

function renderGlobalStats() {
  const dominadas = QUESTIONS.filter(q => getEntry(q.id).box >= 4).length;
  document.getElementById('global-dominadas').textContent = `${dominadas}/${QUESTIONS.length} preguntas dominadas en total`;
}

// ---- Panel de progreso: racha ----
function renderProgressPanel() {
  const history = loadHistory();
  const panel = document.getElementById('progress-panel');
  if (history.length === 0) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';

  const streak = computeStreak(history);
  document.getElementById('streak-badge').innerHTML = streak > 0 ? `<span class="flame">🔥</span> ${streak} día${streak === 1 ? '' : 's'} seguidos` : '';
}

// ---- Banner de diagnóstico inicial (solo si nunca se ha completado una sesión) ----
function renderDiagnosticBanner() {
  const done = localStorage.getItem(DIAG_KEY);
  const history = loadHistory();
  document.getElementById('diagnostic-banner').style.display = (!done && history.length === 0) ? 'flex' : 'none';
}

function startDiagnostic() {
  setupEjes = new Set(EJES);
  setupDificultad = 'mezcla';
  setupMode = 'fixed';
  setupCount = 10;
  startSession(true);
}
document.getElementById('diag-btn').addEventListener('click', startDiagnostic);

renderEjeChips();
updatePoolCount();
renderGlobalStats();
renderProgressPanel();
renderDiagnosticBanner();

document.getElementById('reset-btn').addEventListener('click', () => {
  if (confirm('¿Reiniciar todo tu progreso guardado?')) {
    progress = {};
    saveProgress();
    renderGlobalStats();
  }
});

// ---- Exportar / Importar progreso (respaldo o cambio de dispositivo) ----
document.getElementById('export-btn').addEventListener('click', () => {
  const data = {
    tipo: 'paes-historia-backup',
    version: 1,
    fecha: new Date().toISOString(),
    progress: loadProgress(),
    history: loadHistory(),
    diagDone: localStorage.getItem(DIAG_KEY) || null
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `paes-historia-progreso-${data.fecha.slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-file').click();
});

document.getElementById('import-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.tipo !== 'paes-historia-backup') {
        alert('Este archivo no parece ser un respaldo válido de esta app.');
        return;
      }
      if (!confirm('Esto reemplazará tu progreso actual en este dispositivo por el del archivo importado. ¿Continuar?')) return;
      progress = data.progress || {};
      saveProgress();
      localStorage.setItem(HISTORY_KEY, JSON.stringify(data.history || []));
      if (data.diagDone) localStorage.setItem(DIAG_KEY, data.diagDone);
      if (currentUser) {
        setDoc(userDocRef(currentUser.uid), { diagDone: !!data.diagDone, updatedAt: serverTimestamp() }, { merge: true }).catch(() => {});
        (data.history || []).forEach(entry => {
          addDoc(historyColRef(currentUser.uid), entry).catch(() => {});
        });
      }
      renderGlobalStats();
      renderProgressPanel();
      renderDiagnosticBanner();
      updatePoolCount();
      alert('Progreso importado correctamente.');
    } catch (err) {
      alert('No se pudo leer el archivo. ¿Es un respaldo exportado desde esta misma app?');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ==========================================================
// SESIÓN DE PRÁCTICA (modos: spaced / fixed / timed / random)
// ==========================================================
let session = null; // { mode, pool, queue, index, answered, correct, timerEnd, timerInterval, results: [] }

function startSession(isDiagnostic) {
  const pool = (setupMode === 'exam') ? QUESTIONS.slice() : currentPool();
  if (pool.length === 0) return;

  session = {
    mode: setupMode,
    pool,
    queue: [],
    index: 0,
    lastId: null,
    answered: 0,
    correct: 0,
    missed: [],
    timerInterval: null,
    timerEnd: null,
    current: null,
    selectedIndex: null,
    locked: false,
    isDiagnostic: !!isDiagnostic
  };

  if (session.mode === 'fixed' || session.mode === 'timed') {
    session.queue = shuffle(pool).slice(0, session.mode === 'fixed' ? setupCount : pool.length);
  } else if (session.mode === 'random') {
    session.queue = shuffle(pool);
  } else if (session.mode === 'exam') {
    session.queue = shuffle(pool).slice(0, Math.min(65, pool.length));
  }
  // 'spaced' mode no usa queue fija: pregunta a pregunta con selección ponderada

  if (session.mode === 'timed') {
    session.timerEnd = Date.now() + setupMinutes * 60 * 1000;
    session.timerInterval = setInterval(updateTimer, 250);
  } else if (session.mode === 'exam') {
    session.timerEnd = Date.now() + 120 * 60 * 1000;
    session.timerInterval = setInterval(updateTimer, 250);
  }

  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('practice-screen').style.display = 'block';

  renderTopStats();
  nextQuestion();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateTimer() {
  const msLeft = session.timerEnd - Date.now();
  if (msLeft <= 0) {
    clearInterval(session.timerInterval);
    finishSession();
    return;
  }
  const totalSec = Math.ceil(msLeft / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  const el = document.getElementById('timer-display');
  if (el) el.textContent = `${m}:${s.toString().padStart(2, '0')}`;
}

function renderTopStats() {
  const el = document.getElementById('practice-topstats');
  if (session.mode === 'spaced') {
    const dominadas = session.pool.filter(q => getEntry(q.id).box >= 4).length;
    el.innerHTML = `<div class="stat"><b>${dominadas}/${session.pool.length}</b><small>dominadas</small></div>`;
  } else if (session.mode === 'timed') {
    el.innerHTML = `<span class="timer-pill" id="timer-display">--:--</span>`;
  } else if (session.mode === 'exam') {
    el.innerHTML = `<span class="timer-pill" id="timer-display">--:--</span> <span class="progress-pill">${session.index + 1} / ${session.queue.length}</span>`;
  } else {
    el.innerHTML = `<span class="progress-pill">${session.index + 1} / ${session.queue.length}</span>`;
  }
}

function pickSpacedQuestion() {
  const pool = session.pool.filter(q => q.id !== session.lastId || session.pool.length === 1);
  const weights = pool.map(q => 6 - getEntry(q.id).box);
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

function nextQuestion() {
  if (session.mode !== 'spaced' && session.index >= session.queue.length) {
    finishSession();
    return;
  }

  session.current = (session.mode === 'spaced') ? pickSpacedQuestion() : session.queue[session.index];
  session.lastId = session.current.id;
  session.selectedIndex = null;
  session.locked = false;

  const color = categoryColor(session.current.eje);
  const ejeEl = document.getElementById('q-eje');
  ejeEl.textContent = session.current.eje;
  ejeEl.style.color = color;
  document.getElementById('q-text').textContent = session.current.question;

  document.getElementById('q-options').innerHTML = session.current.options.map((opt, i) => `
    <button class="option" data-index="${i}">
      <span class="letter" style="color:${color}">${LETTERS[i]}</span>
      <span>${opt}</span>
    </button>
  `).join('');
  document.querySelectorAll('.option').forEach(btn => btn.addEventListener('click', onSelectOption));

  const confirmBtn = document.getElementById('confirm-btn');
  confirmBtn.disabled = true;
  confirmBtn.style.display = 'block';

  const feedback = document.getElementById('feedback');
  feedback.classList.remove('show');
  feedback.innerHTML = '';

  renderMasteryRow();
  renderTopStats();
  document.getElementById('session-count').textContent = `${session.answered} respondidas esta sesión`;
}

function renderMasteryRow() {
  const row = document.getElementById('mastery-row');
  const items = (session.mode === 'spaced') ? session.pool : session.queue;
  row.innerHTML = items.map((q, i) => {
    if (session.mode === 'spaced') {
      const entry = getEntry(q.id);
      if (q.id === session.current.id && !session.locked) return `<div class="tick" style="background:${categoryColor(q.eje)};opacity:1"></div>`;
      if (entry.result === 'correct') return `<div class="tick" style="background:var(--correct);opacity:1"></div>`;
      if (entry.result === 'wrong') return `<div class="tick" style="background:var(--wrong);opacity:1"></div>`;
      return `<div class="tick"></div>`;
    } else {
      if (i === session.index) return `<div class="tick" style="background:${categoryColor(q.eje)};opacity:1"></div>`;
      if (i < session.index) {
        const wasWrong = session.missed.some(m => m.q.id === q.id && m.order === i);
        return `<div class="tick" style="background:${wasWrong ? 'var(--wrong)' : 'var(--correct)'};opacity:1"></div>`;
      }
      return `<div class="tick"></div>`;
    }
  }).join('');
}

function onSelectOption(e) {
  if (session.locked) return;
  session.selectedIndex = parseInt(e.currentTarget.dataset.index);
  document.querySelectorAll('.option').forEach(btn => {
    btn.classList.toggle('selected', parseInt(btn.dataset.index) === session.selectedIndex);
  });
  document.getElementById('confirm-btn').disabled = false;
}

function onConfirm() {
  if (session.locked || session.selectedIndex === null) return;
  session.locked = true;

  const q = session.current;
  const isCorrect = session.selectedIndex === q.correct;
  session.answered++;
  if (isCorrect) session.correct++;
  else session.missed.push({ q, order: session.index, selected: session.selectedIndex });

  const entry = getEntry(q.id);
  entry.box = isCorrect ? Math.min(entry.box + 1, 5) : 1;
  entry.result = isCorrect ? 'correct' : 'wrong';
  saveProgress();

  document.querySelectorAll('.option').forEach(btn => {
    const idx = parseInt(btn.dataset.index);
    btn.disabled = true;
    btn.classList.remove('selected');
    if (idx === q.correct) btn.classList.add('correct');
    else if (idx === session.selectedIndex) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  document.getElementById('confirm-btn').style.display = 'none';
  const feedback = document.getElementById('feedback');
  feedback.innerHTML = `
    <div class="verdict ${isCorrect ? 'ok' : 'no'}">${isCorrect ? 'Correcto' : 'Incorrecto'}</div>
    <div class="explanation">${q.explanation}</div>
    <button class="next-btn" id="next-btn">${(session.mode !== 'spaced' && session.index === session.queue.length - 1) ? 'Ver resultados' : 'Siguiente pregunta'}</button>
  `;
  feedback.classList.add('show');
  document.getElementById('next-btn').addEventListener('click', () => {
    if (session.mode !== 'spaced') session.index++;
    nextQuestion();
  });

  renderMasteryRow();
  document.getElementById('session-count').textContent = `${session.answered} respondidas esta sesión`;
}

document.getElementById('confirm-btn').addEventListener('click', onConfirm);

document.getElementById('exit-btn').addEventListener('click', () => {
  if (session && session.timerInterval) clearInterval(session.timerInterval);
  document.getElementById('practice-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'block';
  renderGlobalStats();
});

document.getElementById('start-btn').addEventListener('click', startSession);

// ==========================================================
// PANTALLA 3: RESULTADOS
// ==========================================================
function finishSession() {
  if (session.timerInterval) clearInterval(session.timerInterval);
  document.getElementById('practice-screen').style.display = 'none';
  document.getElementById('results-screen').style.display = 'block';

  const pct = session.answered > 0 ? Math.round((session.correct / session.answered) * 100) : 0;
  document.getElementById('results-score').textContent = `${pct}%`;
  document.getElementById('results-sub').textContent = `${session.correct} de ${session.answered} preguntas correctas`;

  document.getElementById('results-breakdown').innerHTML = `
    <div class="results-stat ok"><b>${session.correct}</b><small>Correctas</small></div>
    <div class="results-stat no"><b>${session.answered - session.correct}</b><small>Incorrectas</small></div>
  `;

  // ---- Guardar en el historial (no aplica al modo Clásico, que es infinito) ----
  if (session.mode !== 'spaced' && session.answered > 0) {
    pushHistory({ date: dayKey(new Date()), mode: session.mode, correct: session.correct, answered: session.answered, pct });
  }

  // ---- Puntaje PAES proyectado (solo Simulacro) ----
  const paesBox = document.getElementById('paes-score-box');
  if (session.mode === 'exam' && session.answered > 0) {
    const proyectado = puntajePAESProyectado(session.correct, session.answered);
    paesBox.style.display = 'block';
    paesBox.innerHTML = `<b>${proyectado} pts</b><small>Puntaje PAES proyectado (escala oficial DEMRE, sobre ${session.answered} preguntas)</small>`;
  } else {
    paesBox.style.display = 'none';
  }

  // ---- Recomendación tras el diagnóstico inicial ----
  const diagBox = document.getElementById('diag-recommend');
  if (session.isDiagnostic) {
    localStorage.setItem(DIAG_KEY, '1');
    if (currentUser) {
      setDoc(userDocRef(currentUser.uid), { diagDone: true }, { merge: true }).catch(() => {});
    }
    let msg;
    if (pct >= 70) msg = 'Buen resultado — prueba partir directo en dificultad <b>Difícil</b>.';
    else if (pct <= 35) msg = 'Conviene partir en dificultad <b>Fácil</b> para agarrar confianza antes de subir.';
    else msg = 'Resultado parejo — la opción <b>Mezcla</b> es un buen punto de partida.';
    diagBox.style.display = 'block';
    diagBox.innerHTML = `📋 <b>Diagnóstico completado.</b> ${msg}`;
  } else {
    diagBox.style.display = 'none';
  }

  // ---- Desglose de preguntas falladas ----
  const missedEl = document.getElementById('missed-list');
  if (session.missed.length > 0) {
    missedEl.innerHTML = `<h3>Preguntas a repasar (${session.missed.length})</h3>` +
      session.missed.map(m => {
        const q = m.q;
        const color = categoryColor(q.eje);
        const tuResp = q.options[m.selected];
        const correcta = q.options[q.correct];
        return `
          <div class="missed-item">
            <div class="missed-eje" style="color:${color}">${q.eje}</div>
            <div class="missed-q">${q.question}</div>
            <div class="missed-answers">
              <div class="wrong-ans">Tu respuesta: ${tuResp}</div>
              <div class="right-ans">Correcta: ${correcta}</div>
            </div>
          </div>
        `;
      }).join('');
  } else {
    missedEl.innerHTML = '';
  }
}

document.getElementById('results-again-btn').addEventListener('click', () => {
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'block';
  renderGlobalStats();
  renderProgressPanel();
  renderDiagnosticBanner();
  updatePoolCount();
});

// ==========================================================
// CUENTA: iniciar sesión / crear cuenta / Google / sincronizar
// ==========================================================

// OJO: getEntry() crea una entrada por defecto (box:1, result:null) para
// cada pregunta apenas se muestra la pantalla de inicio, así que un objeto
// "progress" nunca está realmente vacío. Solo cuenta como "hay progreso" si
// el usuario ya respondió algo de verdad (result != null o box > 1).
function hasMeaningfulProgress(progressObj) {
  return Object.values(progressObj || {}).some(e => e.result !== null || e.box > 1);
}
function hasLocalData() {
  return hasMeaningfulProgress(progress) || loadHistory().length > 0;
}

async function fetchCloudData(uid) {
  const snap = await getDoc(userDocRef(uid));
  const cloudProgress = snap.exists() ? (snap.data().progress || {}) : {};
  const cloudDiagDone = snap.exists() ? !!snap.data().diagDone : false;
  let cloudHistory = [];
  try {
    const histSnap = await getDocs(historyColRef(uid));
    cloudHistory = histSnap.docs.map(d => d.data());
  } catch (e) {}
  return {
    exists: snap.exists() && (hasMeaningfulProgress(cloudProgress) || cloudHistory.length > 0),
    progress: cloudProgress, diagDone: cloudDiagDone, history: cloudHistory
  };
}

async function uploadLocalToCloud(uid) {
  await setDoc(userDocRef(uid), {
    progress,
    diagDone: !!localStorage.getItem(DIAG_KEY),
    updatedAt: serverTimestamp()
  }, { merge: true });
  const localHist = loadHistory();
  for (const entry of localHist) {
    await addDoc(historyColRef(uid), entry);
  }
}

function applyCloudToLocal(cloud) {
  progress = cloud.progress || {};
  saveProgress();
  localStorage.setItem(HISTORY_KEY, JSON.stringify(cloud.history || []));
  if (cloud.diagDone) localStorage.setItem(DIAG_KEY, '1');
}

// Al iniciar sesión: si hay datos guardados tanto en este dispositivo como
// en la cuenta, se le pregunta al usuario cuál de los dos quiere conservar.
async function handleLogin(uid) {
  const cloud = await fetchCloudData(uid);
  const localHasData = hasLocalData();

  if (localHasData && cloud.exists) {
    const useLocal = confirm(
      'Tienes progreso guardado tanto en este dispositivo como en tu cuenta.\n\n' +
      'Aceptar = usar el progreso de ESTE DISPOSITIVO (reemplaza el de la nube)\n' +
      'Cancelar = usar el progreso de TU CUENTA (reemplaza el de este dispositivo)'
    );
    if (useLocal) { await uploadLocalToCloud(uid); }
    else { applyCloudToLocal(cloud); }
  } else if (localHasData && !cloud.exists) {
    await uploadLocalToCloud(uid);
  } else if (!localHasData && cloud.exists) {
    applyCloudToLocal(cloud);
  }

  renderGlobalStats();
  renderProgressPanel();
  renderDiagnosticBanner();
  updatePoolCount();
}

function renderAccountBar() {
  const bar = document.getElementById('account-bar');
  if (currentUser) {
    bar.innerHTML = `
      <div class="account-info">
        <span>👤 ${currentUser.email || 'tu cuenta de Google'}</span>
        <button class="logout-link" id="logout-btn">Cerrar sesión</button>
      </div>`;
    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
  } else {
    bar.innerHTML = `<button id="login-open-btn">Iniciar sesión para guardar tu progreso en la nube</button>`;
    document.getElementById('login-open-btn').addEventListener('click', openAuthModal);
  }
}

const AUTH_ERROR_MESSAGES = {
  'auth/invalid-email': 'Ese correo no es válido.',
  'auth/user-not-found': 'No existe una cuenta con ese correo.',
  'auth/wrong-password': 'Contraseña incorrecta.',
  'auth/invalid-credential': 'Correo o contraseña incorrectos.',
  'auth/email-already-in-use': 'Ya existe una cuenta con ese correo — intenta iniciar sesión.',
  'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
  'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos e intenta de nuevo.',
  'auth/popup-closed-by-user': 'Se cerró la ventana de Google antes de terminar.'
};
function friendlyAuthError(err) {
  return AUTH_ERROR_MESSAGES[err.code] || 'Ocurrió un error. Intenta nuevamente.';
}
function showAuthError(message) {
  const el = document.getElementById('auth-error');
  el.textContent = message;
  el.style.display = 'block';
}

function updateAuthModalMode() {
  document.getElementById('auth-title').textContent = authMode === 'login' ? 'Iniciar sesión' : 'Crear cuenta';
  document.getElementById('auth-submit').textContent = authMode === 'login' ? 'Iniciar sesión' : 'Crear cuenta';
  const switchEl = document.getElementById('auth-switch');
  switchEl.innerHTML = authMode === 'login'
    ? '¿No tienes cuenta? <a href="#" id="auth-switch-link">Crea una</a>'
    : '¿Ya tienes cuenta? <a href="#" id="auth-switch-link">Inicia sesión</a>';
  document.getElementById('auth-switch-link').addEventListener('click', (e) => {
    e.preventDefault();
    authMode = authMode === 'login' ? 'register' : 'login';
    updateAuthModalMode();
  });
}

function openAuthModal() {
  authMode = 'login';
  updateAuthModalMode();
  document.getElementById('auth-error').style.display = 'none';
  document.getElementById('auth-email').value = '';
  document.getElementById('auth-password').value = '';
  document.getElementById('auth-modal').style.display = 'flex';
}
function closeAuthModal() { document.getElementById('auth-modal').style.display = 'none'; }

document.getElementById('auth-close').addEventListener('click', closeAuthModal);
document.getElementById('auth-modal').addEventListener('click', (e) => {
  if (e.target.id === 'auth-modal') closeAuthModal();
});

document.getElementById('auth-submit').addEventListener('click', async () => {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!email || !password) { showAuthError('Completa correo y contraseña.'); return; }
  document.getElementById('auth-error').style.display = 'none';
  const btn = document.getElementById('auth-submit');
  btn.disabled = true;
  try {
    if (authMode === 'login') {
      await signInWithEmailAndPassword(auth, email, password);
    } else {
      await createUserWithEmailAndPassword(auth, email, password);
    }
    closeAuthModal();
  } catch (err) {
    showAuthError(friendlyAuthError(err));
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('auth-google').addEventListener('click', async () => {
  document.getElementById('auth-error').style.display = 'none';
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
    closeAuthModal();
  } catch (err) {
    showAuthError(friendlyAuthError(err));
  }
});

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  renderAccountBar();
  if (user) {
    await handleLogin(user.uid);
  }
});

renderAccountBar();
</script>
