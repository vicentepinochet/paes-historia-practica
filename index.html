<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Práctica PAES — Historia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --paper: #fbfbf7;
    --paper-2: #f3f2ec;
    --ink: #23261f;
    --ink-2: #383c31;
    --ink-soft: rgba(35,38,31,0.6);
    --gold: #c68a1f;
    --gold-soft: rgba(198,138,31,0.14);
    --select: #4a7fd6;
    --select-bg: rgba(74,127,214,0.12);
    --correct: #1f9d55;
    --correct-bg: rgba(31,157,85,0.14);
    --wrong: #e5484d;
    --wrong-bg: rgba(229,72,77,0.12);
    --line: rgba(35,38,31,0.12);
    --font-display: 'Baloo 2', 'Inter', sans-serif;
    --font-body: 'Inter', -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(176,141,62,0.10), transparent 60%),
      radial-gradient(ellipse 700px 600px at 100% 100%, rgba(31,42,36,0.05), transparent 55%);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  .app { width: 100%; max-width: 640px; }

  /* ---------- HEADER ---------- */
  .top {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 28px; flex-wrap: wrap; gap: 10px;
  }
  .title {
    font-family: var(--font-display); font-weight: 700; font-size: 2.4rem;
    letter-spacing: -0.01em;
  }
  .title span { color: var(--gold); font-weight: 700; }
  .subtitle { font-size: 0.85rem; color: var(--ink-soft); margin-top: 2px; }

  .stats { display: flex; gap: 20px; font-size: 0.85rem; }
  .stat { text-align: right; }
  .stat b { display: block; font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
  .stat small { color: var(--ink-soft); }

  /* ---------- MASTERY TICKS ---------- */
  .mastery-row { display: flex; gap: 3px; margin-bottom: 34px; }
  .tick {
    flex: 1; height: 6px; border-radius: 3px; background: var(--line);
    transition: background 0.4s ease;
  }

  /* ---------- CARD ---------- */
  .card {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 44px 38px;
    position: relative;
    box-shadow: 0 2px 14px rgba(35,38,31,0.05);
  }

  .eje {
    font-size: 0.8rem; color: var(--gold); font-weight: 600;
    margin-bottom: 18px;
  }

  .question {
    font-family: var(--font-display); font-size: 1.35rem; font-weight: 500;
    line-height: 1.4; color: var(--ink); margin-bottom: 30px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    text-align: left; padding: 15px 18px; border-radius: 14px;
    border: 2px solid var(--line); background: rgba(255,255,255,0.6);
    font-family: var(--font-body); font-size: 0.98rem; color: var(--ink);
    cursor: pointer; display: flex; gap: 12px; align-items: flex-start;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--select); background: var(--select-bg); }
  .option:disabled { cursor: default; }
  .option:active:not(:disabled) { transform: scale(0.99); }

  .option .letter {
    font-family: var(--font-display); font-weight: 700; color: var(--gold);
    flex-shrink: 0; width: 20px;
  }

  .option.selected { border-color: var(--select); background: var(--select-bg); }
  .option.selected .letter { color: var(--select); }

  .option.correct { border-color: var(--correct); background: var(--correct-bg); }
  .option.correct .letter { color: var(--correct); }
  .option.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .option.wrong .letter { color: var(--wrong); }
  .option.dim { opacity: 0.45; }

  .confirm-btn {
    margin-top: 18px; padding: 14px 26px; border: none; border-radius: 14px;
    background: var(--select); color: white; font-family: var(--font-display);
    font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .confirm-btn:hover:not(:disabled) { background: #3b6bc0; }
  .confirm-btn:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }

  /* ---------- FEEDBACK ---------- */
  .feedback {
    margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line);
    opacity: 0; max-height: 0; overflow: hidden;
    transition: opacity 0.35s ease;
  }
  .feedback.show { opacity: 1; max-height: 400px; }

  .verdict { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin-bottom: 8px; }
  .verdict.ok { color: var(--correct); }
  .verdict.no { color: var(--wrong); }
  .explanation { font-size: 0.93rem; color: var(--ink-2); line-height: 1.55; }

  .next-btn {
    margin-top: 22px; padding: 13px 26px; border: none; border-radius: 14px;
    background: var(--ink); color: var(--paper); font-family: var(--font-display);
    font-weight: 600; font-size: 0.98rem; cursor: pointer;
    transition: background 0.15s ease;
  }
  .next-btn:hover { background: var(--ink-2); }

  /* ---------- FOOTER ---------- */
  .foot {
    margin-top: 26px; display: flex; justify-content: space-between; align-items: center;
    font-size: 0.8rem; color: var(--ink-soft); flex-wrap: wrap; gap: 10px;
  }
  .foot-actions { display: flex; gap: 14px; }
  .reset-btn {
    background: none; border: none; color: var(--ink-soft); text-decoration: underline;
    font-size: 0.8rem; cursor: pointer; font-family: var(--font-body);
  }
  .reset-btn:hover { color: var(--wrong); }

  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- SETUP SCREEN ---------- */
  .setup-card {
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 20px;
    padding: 32px; box-shadow: 0 2px 14px rgba(35,38,31,0.05);
  }
  .setup-section { margin-bottom: 26px; }
  .setup-label {
    font-family: var(--font-display); font-weight: 700; font-size: 0.95rem;
    margin-bottom: 12px; color: var(--ink);
  }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-family: var(--font-body); font-size: 0.88rem; font-weight: 600;
    padding: 9px 16px; border-radius: 999px; border: 2px solid var(--line);
    background: white; color: var(--ink); cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .chip:hover { border-color: var(--select); }
  .chip.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .chip.eje-chip.active { color: white; }
  #dificultad-chips .chip.active { background: #1c8fcb; border-color: #1c8fcb; color: white; }

  .mode-list { display: flex; flex-direction: column; gap: 10px; }
  .mode-item { display: flex; flex-direction: column; }
  .mode-config {
    margin-top: 8px; padding: 12px 14px; background: var(--select-bg);
    border: 1px solid var(--select); border-radius: 12px;
  }
  .mode-config .setup-label { font-size: 0.85rem; margin-bottom: 8px; }
  .mode-option {
    text-align: left; padding: 14px 18px; border-radius: 14px;
    border: 2px solid var(--line); background: white; cursor: pointer;
    display: flex; flex-direction: column; gap: 4px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .mode-option:hover { border-color: var(--select); }
  .mode-option.active { border-color: var(--select); background: var(--select-bg); }
  .mode-name { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; }
  .mode-desc { font-size: 0.82rem; color: var(--ink-soft); }
  .mode-option { position: relative; padding-top: 16px; }
  .mode-more {
    position: absolute; top: 14px; right: 14px;
    width: 17px; height: 17px; border-radius: 50%;
    border: 1.5px solid var(--select); color: var(--select);
    font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 700;
    font-size: 0.68rem; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
  }
  .mode-more-text {
    font-size: 0.8rem; color: var(--ink-soft); margin-top: 6px; display: none;
  }
  .mode-more-text.show { display: block; }

  .pool-count { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 18px; text-align: center; }

  .start-btn {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: #1c8fcb; color: white; font-family: var(--font-display);
    font-weight: 700; font-size: 1.05rem; cursor: pointer;
    transition: background 0.15s ease;
  }
  .start-btn:hover:not(:disabled) { background: #17739f; }
  .start-btn:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }

  .back-btn {
    background: none; border: none; color: var(--ink-soft); font-family: var(--font-body);
    font-weight: 600; font-size: 0.9rem; cursor: pointer; padding: 8px 0;
  }
  .back-btn:hover { color: var(--ink); }

  .timer-pill {
    font-family: var(--font-display); font-weight: 700; font-size: 0.95rem;
    padding: 6px 14px; border-radius: 999px; background: var(--wrong-bg); color: var(--wrong);
  }
  .progress-pill {
    font-family: var(--font-display); font-weight: 700; font-size: 0.95rem;
    padding: 6px 14px; border-radius: 999px; background: var(--select-bg); color: var(--select);
  }

  /* ---------- RESULTS SCREEN ---------- */
  .results-card {
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 20px;
    padding: 40px 32px; text-align: center; margin-bottom: 20px;
  }
  .results-score {
    font-family: var(--font-display); font-weight: 800; font-size: 3rem; color: var(--ink);
  }
  .results-sub { font-size: 0.95rem; color: var(--ink-soft); margin-top: 6px; margin-bottom: 24px; }
  .results-breakdown { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; }
  .results-stat { text-align: center; }
  .results-stat b { display: block; font-family: var(--font-display); font-size: 1.4rem; }
  .results-stat.ok b { color: var(--correct); }
  .results-stat.no b { color: var(--wrong); }
  .results-stat small { color: var(--ink-soft); font-size: 0.78rem; }

  /* ---------- PROGRESS PANEL / STREAK / SPARKLINE ---------- */
  .progress-panel { margin-bottom: 18px; }
  .progress-row {
    display: flex; align-items: center; gap: 16px; background: var(--paper-2);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px;
  }
  .streak-badge {
    font-family: var(--font-display); font-weight: 700; font-size: 0.95rem;
    white-space: nowrap; color: var(--ink);
  }
  .flame {
    display: inline-block; animation: flicker 2.4s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes flicker {
    0%, 100% { transform: scale(1) rotate(-2deg); filter: brightness(1); }
    25%      { transform: scale(1.08) rotate(2deg); filter: brightness(1.15); }
    50%      { transform: scale(0.95) rotate(-1deg); filter: brightness(0.95); }
    75%      { transform: scale(1.05) rotate(1deg); filter: brightness(1.1); }
  }

  /* ---------- DIAGNOSTIC BANNER ---------- */
  .diagnostic-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    background: var(--select-bg); border: 2px solid var(--select); border-radius: 14px;
    padding: 14px 18px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .diag-text { font-size: 0.88rem; color: var(--ink); }
  .diag-btn {
    background: var(--select); color: white; border: none; border-radius: 10px;
    padding: 10px 18px; font-family: var(--font-display); font-weight: 700;
    font-size: 0.88rem; cursor: pointer; white-space: nowrap;
  }
  .diag-btn:hover { background: #3b6bc0; }

  /* ---------- RESULTS: MISSED BREAKDOWN + PUNTAJE PAES ---------- */
  .paes-score-box {
    background: var(--select-bg); border: 1px solid var(--select); border-radius: 14px;
    padding: 16px; margin-top: 18px; text-align: center;
  }
  .paes-score-box b { font-family: var(--font-display); font-size: 1.6rem; color: var(--select); }
  .paes-score-box small { display: block; color: var(--ink-soft); font-size: 0.78rem; margin-top: 2px; }

  .missed-list { margin-top: 22px; text-align: left; }
  .missed-list h3 {
    font-family: var(--font-display); font-size: 1rem; margin-bottom: 12px; color: var(--ink);
  }
  .missed-item {
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .missed-eje { font-size: 0.75rem; font-weight: 700; margin-bottom: 6px; }
  .missed-q { font-size: 0.9rem; color: var(--ink); margin-bottom: 8px; }
  .missed-answers { font-size: 0.82rem; }
  .missed-answers .wrong-ans { color: var(--wrong); }
  .missed-answers .right-ans { color: var(--correct); }

  .diag-recommend {
    background: var(--correct-bg); border: 1px solid var(--correct); border-radius: 12px;
    padding: 14px 16px; margin-top: 18px; font-size: 0.88rem; color: var(--ink); text-align: left;
  }

  /* ---------- CUENTA / LOGIN ---------- */
  .account-bar { display: flex; justify-content: center; margin-bottom: 18px; }
  .account-bar button {
    background: none; border: none; color: var(--select); font-family: var(--font-body);
    font-weight: 600; font-size: 0.85rem; cursor: pointer; text-decoration: underline;
  }
  .account-info {
    font-size: 0.85rem; color: var(--ink-soft); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
  }
  .account-info .logout-link {
    background: none; border: none; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font-size: 0.85rem;
  }

  .auth-modal {
    position: fixed; inset: 0; background: rgba(35,38,31,0.45);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .auth-card {
    background: var(--paper); border-radius: 20px; padding: 32px; width: 100%; max-width: 380px;
    position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .auth-close {
    position: absolute; top: 14px; right: 16px; background: none; border: none;
    font-size: 1.4rem; line-height: 1; cursor: pointer; color: var(--ink-soft);
  }
  .auth-input {
    width: 100%; padding: 13px 14px; margin-top: 12px; border-radius: 12px; border: 2px solid var(--line);
    font-family: var(--font-body); font-size: 0.95rem; background: white; color: var(--ink);
  }
  .auth-input:focus-visible { outline: 2px solid var(--select); outline-offset: 1px; }
  .auth-error {
    background: var(--wrong-bg); color: var(--wrong); border-radius: 10px; padding: 10px 14px;
    font-size: 0.85rem; margin-top: 12px;
  }
  .auth-or { text-align: center; font-size: 0.8rem; color: var(--ink-soft); margin: 14px 0; }
  .auth-google-btn {
    width: 100%; padding: 13px; border-radius: 14px; border: 2px solid var(--line); background: white;
    color: var(--ink); font-family: var(--font-body); font-weight: 600; font-size: 0.92rem; cursor: pointer;
  }
  .auth-google-btn:hover { border-color: var(--select); }
  .auth-switch { text-align: center; font-size: 0.85rem; color: var(--ink-soft); margin-top: 18px; }
  .auth-switch a { color: var(--select); font-weight: 600; text-decoration: none; }
  #auth-submit { margin-top: 18px; }
</style>
</head>
<body>

<!-- ============================================================
     BANCO DE PREGUNTAS — Forma 123, Admisión 2026 (DEMRE).
     El eje, la respuesta correcta y la explicación ya están
     cargados (cruzados con el clavijero oficial). SOLO falta que
     pegues el enunciado y las 4 alternativas exactas de cada
     pregunta, copiándolos desde tu propio PDF de selección de
     preguntas — reemplaza cada "PEGA AQUÍ..." por el texto real.
     El número en el id corresponde al número de pregunta original
     del folleto, para que sea fácil ubicarla.
     ============================================================ -->
<script>
const OFFICIAL_QUESTIONS = [
  { id: "q1", eje: "Formación Ciudadana", dificultad: "dificil", correct: 1,
    question: "En el contexto del Estado de derecho vigente en Chile durante las primeras décadas del siglo XXI, se han registrado avances en materia de igualdad de género en diferentes ámbitos. ¿Cuál ha sido una acción del Estado tendiente a avanzar en una mayor igualdad de género en el ámbito institucional?",
    options: ["El establecimiento por ley de la proporcionalidad de género en los cargos gerenciales.", "La fijación de cuotas de género en la presentación de las candidaturas parlamentarias.", "La implementación de un sistema de ingreso paritario de estudiantes a las escuelas públicas.", "El término de las brechas salariales como consecuencia de la política de equidad de género."],
    explanation: "Las cuotas de género en las candidaturas parlamentarias son una acción concreta del Estado para avanzar hacia la igualdad de género a nivel institucional." },
  { id: "q2", eje: "Formación Ciudadana", dificultad: "dificil", correct: 2,
    question: "Lee el siguiente texto sobre la relación entre los medios de comunicación y la democracia: «Si históricamente los medios podían ser considerados como el cuarto poder, en tanto constituían una institución de la sociedad que podía vigilar el comportamiento de la clase gobernante, ahora los propios medios son a su vez vigilados por grupos que, a través de redes sociales online, participan activamente en los debates públicos, y que a menudo presentan niveles de desconfianza relativamente altos hacia las instituciones». CIPER Chile (2013). ¿Cuál es uno de los impactos que ha provocado en el funcionamiento de la democracia la situación descrita en el texto?",
    options: ["El deterioro del carácter pluralista del intercambio de ideas.", "La falta de interés de la clase política por controlar la prensa.", "La diversificación de los espacios de involucramiento ciudadano.", "El debilitamiento de las garantías para ejercer la libertad de prensa."],
    explanation: "Las redes sociales multiplicaron los espacios donde la ciudadanía participa y se involucra en el debate público, más allá de los medios tradicionales." },
  { id: "q3", eje: "Formación Ciudadana", dificultad: "facil", correct: 3,
    question: "Uno de los pilares del Estado de derecho es la división del poder estatal. ¿Por qué es importante que los poderes del Estado actúen con independencia?",
    options: ["Porque incentiva la participación ciudadana en el aparato público.", "Porque permite prescindir de un ordenamiento jurídico permanente.", "Porque robustece la diversidad ideológica al interior de la sociedad.", "Porque contribuye a evitar el surgimiento de autoritarismos políticos."],
    explanation: "La independencia entre los poderes del Estado es un contrapeso que impide la concentración de poder y, con ello, el surgimiento de regímenes autoritarios." },
  { id: "q4", eje: "Formación Ciudadana", dificultad: "facil", correct: 0,
    question: "En el siglo XXI, el régimen democrático es el sistema político más difundido en el mundo occidental. ¿Cuál es uno de los fundamentos que se le atribuye a este régimen?",
    options: ["La garantía en el respeto a los derechos fundamentales.", "La importancia de una ideología única que dirige el gobierno.", "La toma de decisiones consensuadas entre los poderes estatales.", "La participación ciudadana directa en las decisiones gubernamentales."],
    explanation: "Garantizar el respeto a los derechos fundamentales es uno de los pilares que sostiene la legitimidad de los regímenes democráticos." },
  { id: "q6", eje: "Formación Ciudadana", dificultad: "facil", correct: 3,
    question: "Los sistemas democráticos actuales consideran entre sus principios la transparencia, la cual obliga a los integrantes de las instituciones públicas a informar sobre sus acciones y decisiones a la ciudadanía. Al respecto, ¿de qué manera la transparencia contribuye al funcionamiento de la democracia?",
    options: ["Garantizando la presencia de la ciudadanía en el debate público.", "Admitiendo la injerencia de la ciudadanía en el sistema de justicia.", "Asegurando el apoyo de la ciudadanía a las autoridades en ejercicio.", "Permitiendo que la ciudadanía fiscalice el ejercicio de la gestión estatal."],
    explanation: "La transparencia permite que la ciudadanía fiscalice cómo se gestionan las instituciones públicas, fortaleciendo el control democrático." },
  { id: "q7", eje: "Formación Ciudadana", dificultad: "dificil", correct: 3,
    question: "La probidad es un atributo fundamental en las democracias actuales que involucra que en las acciones de los funcionarios públicos prevalezca el interés general por sobre el individual. Al respecto, ¿cuál es un mecanismo legal que contribuye a resguardar la probidad en el sistema democrático?",
    options: ["La facultad del presidente de la República de remover empleados públicos.", "La intervención de la Contraloría en la elaboración del presupuesto nacional.", "La obligación de las Fuerzas Armadas de fiscalizar el gasto público nacional.", "La exigencia de declaración de patrimonio a las autoridades representativas."],
    explanation: "Exigir declaración de patrimonio a las autoridades es un mecanismo legal concreto para resguardar la probidad en el ejercicio de cargos públicos." },
  { id: "q8", eje: "Formación Ciudadana", dificultad: "dificil", correct: 0,
    question: "En Chile, el Estado debe asegurar que todas las personas tengan un proceso judicial justo sin discriminación. Al respecto, ¿de qué manera el Estado promueve el cumplimiento de lo anterior?",
    options: ["Garantizando legalmente la defensa a los grupos con menor nivel de ingresos.", "Procurando que causas legales de similar naturaleza tengan igual sentencia.", "Fomentando que los litigios penales sean resueltos con parcialidad en los tribunales.", "Asegurando que los tribunales tomen decisiones en conjunto con los otros poderes del Estado."],
    explanation: "Garantizar defensa legal a quienes tienen menos ingresos ayuda a igualar el acceso a un proceso judicial justo, sin discriminación económica." },
  { id: "q9", eje: "Formación Ciudadana", dificultad: "dificil", correct: 2,
    question: "En el sistema democrático los partidos políticos ejercen un rol en la vinculación de la ciudadanía con la institucionalidad vigente. En el caso chileno estas organizaciones tienen un carácter autónomo y abarcan un variado espectro ideológico. En el contexto del sistema democrático nacional, ¿cuál es una de las acciones que realizan los partidos políticos de oposición?",
    options: ["Vetar las iniciativas legales presentadas por el Ejecutivo.", "Aplicar sanciones a la corrupción en la administración pública.", "Fiscalizar la gestión realizada por las autoridades de gobierno.", "Limitar la cantidad de proyectos de ley discutidos en el Congreso."],
    explanation: "Fiscalizar la gestión de gobierno es una función característica de los partidos de oposición dentro del sistema democrático." },
  { id: "q10", eje: "Formación Ciudadana", dificultad: "facil", correct: 2,
    question: "Uno de los principios del sistema democrático es la existencia de garantías de igualdad de derechos políticos para la población. En el caso chileno, se han tomado diversas medidas para facilitar el ejercicio del sufragio por parte de la ciudadanía. En el contexto chileno del siglo XXI, ¿cuál de las siguientes medidas ha adoptado el Estado de Chile para lograr este objetivo?",
    options: ["Habilitar la votación a distancia de manera electrónica.", "Ampliar el rango de edad para participar en votaciones.", "Implementar el voto asistido en los locales de votación.", "Diversificar los organismos encargados de las votaciones."],
    explanation: "El voto asistido en los locales de votación es una medida concreta adoptada en Chile para facilitar el ejercicio del sufragio." },
  { id: "q11", eje: "Formación Ciudadana", dificultad: "dificil", correct: 0,
    question: "Lee la siguiente noticia referida al funcionamiento del Poder Judicial chileno: «Según cifras del Poder Judicial, durante el 2015 una causa se demoraba en promedio 222 días. El año pasado esa cifra subió a 472 días. A juicio de los expertos, si bien la pandemia agudizó la situación, también existen razones de gestión y cambios en las causas penales que actualmente se tramitan, para lograr revertir esta situación es necesario hacer investigaciones más eficientes, con peritajes y diligencias estrictamente necesarias y pertinentes». Respecto del funcionamiento del sistema judicial, ¿qué impacto genera la situación descrita en el texto?",
    options: ["Reduce la capacidad de administración oportuna de la justicia.", "Restringe el control de la probidad en el desempeño funcionario.", "Debilita la imparcialidad de las personas que dictan las condenas.", "Invalida la aplicación de las disposiciones contenidas en las sentencias."],
    explanation: "El aumento en los tiempos de tramitación de causas judiciales reduce la capacidad del sistema para administrar justicia de forma oportuna." },
  { id: "q12", eje: "Formación Ciudadana", dificultad: "dificil", correct: 3,
    question: "Junto con su función legislativa, en Chile la Cámara de Diputadas y Diputados también posee facultades fiscalizadoras de los actos de gobierno. En este sentido, ¿cuál de las siguientes situaciones forma parte de las atribuciones fiscalizadoras de la Cámara de Diputadas y Diputados?",
    options: ["La petición al Contralor General de la República de supervisar el desarrollo de los procesos electorales.", "La citación a los altos mandos policiales para establecer en conjunto la estructura jerárquica institucional.", "La orientación a las municipalidades de destinar la mayor parte de su presupuesto a mejorar la infraestructura.", "La interpelación al Ministro del Interior porque existen dudas sobre las estrategias en materia de seguridad pública."],
    explanation: "Interpelar a un ministro para exigir explicaciones sobre su gestión es una atribución fiscalizadora explícita de la Cámara de Diputados; las otras opciones describen funciones que no le corresponden a esta cámara." },
  { id: "q13", eje: "Formación Ciudadana", dificultad: "dificil", correct: 1,
    question: "Lee el siguiente texto: «Los algoritmos de recomendación de las plataformas digitales priorizan el contenido que genera mayor interacción, lo que lleva a mostrarnos publicaciones afines a nuestras propias opiniones. […] quedamos aislados en comunidades donde predominan puntos de vista similares al nuestro, un espacio uniforme que actúa como una caja de resonancia que intensifica nuestros sesgos, debido a nuestra inclinación a validar como ciertas las informaciones que refuerzan lo que ya creemos. Según diversos investigadores en comunicación digital, el debate democrático se ve empobrecido cuando los ciudadanos dejan de exponerse a perspectivas divergentes». Rodríguez, M. (2019). En las sociedades democráticas del siglo XXI, las redes sociales han aumentado su influencia sobre el funcionamiento del sistema político. En este contexto, ¿de qué manera impacta en la sociedad democrática el fenómeno descrito en el texto?",
    options: ["Disminuyendo el interés por utilizar plataformas digitales.", "Aumentando la polarización en el diálogo ciudadano.", "Reduciendo las instancias de debate en medios virtuales.", "Incrementando la objetividad de la información circulante."],
    explanation: "El 'filtro burbuja' encierra a las personas en entornos de opinión homogéneos, lo que tiende a profundizar la polarización del debate ciudadano." },
  { id: "q14", eje: "Formación Ciudadana", dificultad: "dificil", correct: 0,
    question: "La ley electoral chilena establece la participación de una parte de la ciudadanía como vocal de mesa durante los procesos eleccionarios. Considerando el funcionamiento de las elecciones, ¿cuál es uno de los objetivos que tiene la figura de los vocales de mesa?",
    options: ["Garantizar mayores niveles de transparencia electoral.", "Disminuir el gasto público asociado al proceso electoral.", "Vincular a la población con los partidos durante las elecciones.", "Evitar que el Estado se involucre en la gestión de las elecciones."],
    explanation: "La figura del vocal de mesa busca garantizar mayor transparencia en el desarrollo de los procesos electorales." },
  { id: "q15", eje: "Formación Ciudadana", dificultad: "dificil", correct: 3,
    question: "Lee el siguiente texto referido a la relación que existe entre medios de comunicación y democracia: «Las democracias occidentales suelen mostrar gran preocupación por los impedimentos a la libertad de prensa en Rusia, en Zimbabwe o en el mundo árabe, pero se abstienen de todo comentario sobre los procesos monopolizadores que se desarrollan en el interior de sus Estados». Blesa, P. (2006). Medios de comunicación y democracia. ¿El poder de los medios o los medios al poder? Respecto de los riesgos que enfrenta una sociedad democrática, ¿a qué fenómeno se alude en el texto?",
    options: ["El carácter globalizador de los medios de comunicación.", "El uso de los medios de comunicación como fuerza opositora.", "La escasa cobertura informativa de los medios de comunicación.", "La concentración de la propiedad de los medios de comunicación."],
    explanation: "La concentración de la propiedad de los medios de comunicación es uno de los riesgos que enfrentan las sociedades democráticas." },

  { id: "q16", eje: "Historia Universal", dificultad: "dificil", correct: 0,
    question: "El ideario liberal difundido en América Latina durante el siglo XIX propuso un conjunto de ideas que resaltaban la condición individual y racional del ser humano. Al respecto, ¿de qué manera estas ideas influyeron en la formación de los nuevos Estados nacionales?",
    options: ["Fijando diversas restricciones al ejercicio del poder político.", "Difundiendo principios fundados en el pensamiento católico.", "Erradicando las prácticas de nepotismo al interior del gobierno.", "Incorporando la participación electoral de los sectores populares."],
    explanation: "El ideario liberal del siglo XIX buscó fijar límites al ejercicio del poder político en los nuevos Estados nacionales de América Latina." },
  { id: "q17", eje: "Historia Universal", dificultad: "dificil", correct: 0,
    question: "Durante la primera mitad del siglo XIX en América Latina se aplicaron las ideas liberales en el marco del proceso de conformación de los Estados nacionales. ¿Cuál fue una de las ideas liberales implementadas durante este período?",
    options: ["La búsqueda del progreso material de la población.", "La ampliación del sufragio a los sectores populares.", "La obligación de transparentar la información pública.", "La erradicación de la participación militar en el gobierno."],
    explanation: "La búsqueda del progreso material fue una de las ideas liberales centrales aplicadas en la construcción de los Estados nacionales latinoamericanos." },
  { id: "q20", eje: "Historia Universal", dificultad: "dificil", correct: 0,
    question: "Lee el siguiente texto referido al Estado-nación en América Latina durante el siglo XIX: «El nuevo Estado liberal se erigió sobre sociedades definidas como naciones. Este concepto de nación que empezó a utilizarse a partir de ahora alude a ciertos elementos comunes de la sociedad, tales como la comunidad territorial, de lengua y de cultura, pero no se definió su carácter clasista, sino que se concibió en principio como una unidad indivisible integrada por una suma de individualidades de carácter homogéneo e igualitario». Ossenbach Sauter, G. (1993). Estado y educación en América Latina a partir de su independencia (siglos XIX y XX). Considerando la descripción del texto, ¿cuál fue un efecto de la aplicación de esta forma de organización en la sociedad hispanoamericana del siglo XIX?",
    options: ["Requirió la construcción de una identidad nacional desde las elites.", "Reconoció la multinacionalidad en los espacios geográficos locales.", "Consolidó a los pueblos indígenas como nuevos protagonistas nacionales.", "Favoreció la participación de los sectores populares en la política nacional."],
    explanation: "La construcción de una identidad nacional homogénea fue impulsada principalmente desde las elites al conformarse los nuevos Estados-nación." },
  { id: "q21", eje: "Historia Universal", dificultad: "dificil", correct: 3,
    question: "Durante el siglo XIX, el liberalismo fue una doctrina política, económica y social que influyó en gran parte de los procesos de conformación de los Estados nacionales en Europa y América. En este contexto, ¿de qué forma se evidenció esta influencia en América Latina?",

    explanation: "La influencia liberal en América Latina se reflejó jurídicamente en el establecimiento de la separación de los poderes públicos." },
  { id: "q23", eje: "Historia de Chile", dificultad: "dificil", correct: 0,
    question: "Lee el siguiente texto sobre el hallazgo de minerales en California y Australia a mediados del siglo XIX: «No ha pasado aún una generación desde que el mundo se sorprendió con el descubrimiento de yacimientos auríferos de riqueza inigualable localizados en la lejana región de California. Y cuando poco después se encontraron minas de este mismo metal precioso en Australia, el entusiasmo rebasó las fronteras. Aún en lugares tan lejanos y aislados como China, se sintieron los efectos y pronto los chinos comenzaron a migrar a California y Australia en búsqueda del dorado». Patterson, R. (1982). The New Golden Age and Influence of the Precious Metals upon the World. En Botero, M. (2007). La ruta del oro: una economía primaria exportadora: Antioquia, 1850-1890. Considerando el contexto histórico, ¿cuál fue un efecto en la economía chilena a mediados del siglo XIX de la situación descrita en el texto?",
    options: ["Incrementó el volumen de la exportación de cereales.", "Amplió la inversión estatal en la producción de salitre.", "Aumentó los aranceles aduaneros a las importaciones.", "Acrecentó la inversión de capitales nacionales en Asia."],
    explanation: "La fiebre del oro en California y Australia elevó la demanda de alimentos, lo que impulsó las exportaciones chilenas de cereales a esos mercados." },
  { id: "q24", eje: "Historia de Chile", dificultad: "dificil", correct: 0,
    question: "Diversas medidas económicas implementadas en Chile durante la primera mitad del siglo XIX, buscaban hacer más eficiente el sistema económico nacional. ¿Cuál fue una de las acciones llevada a cabo por los gobiernos de la época para conseguir este objetivo?",

    explanation: "Los gobiernos de la primera mitad del siglo XIX buscaron dinamizar la economía otorgando incentivos a la inversión privada en actividades productivas." },
  { id: "q27", eje: "Historia de Chile", dificultad: "dificil", correct: 0,
    question: "Desde el periodo de la República Conservadora en Chile se produjo una expansión de la educación pública con la creación de leyes y la fundación de diversas instituciones educativas que contribuyeron al desarrollo del país. En este contexto, ¿cuál fue un impacto social provocado por la expansión de la educación pública?",
    options: ["Propició la formación cívica en las escuelas.", "Aseguró la participación política de la clase media.", "Consolidó el ingreso de las mujeres a la universidad.", "Promovió la masificación de la migración campo-ciudad."],

  { id: "q28", eje: "Historia de Chile", dificultad: "dificil", correct: 1,
    question: "Los estudiantes de un curso deben recrear un debate político situado en el periodo de formación de la República en Chile. Considerando las ideas predominantes en los grupos políticos de la época, ¿cuál es un argumento que debe utilizar el grupo que defiende las ideas de la facción federal?",
    options: ["La organización federal homogeniza las identidades locales.", "La organización federal contribuye a la distribución del poder.", "La organización federal abarata el costo de la administración pública.", "La organización federal favorece la uniformidad en el cobro de impuestos."],
    explanation: "El argumento central de los federalistas era que ese modelo de organización contribuye a distribuir el poder político en lugar de concentrarlo." },
  { id: "q30", eje: "Historia de Chile", dificultad: "dificil", correct: 0,
    question: "Lee el siguiente extracto de una carta del líder sindical Luis Emilio Recabarren, publicada en el periódico El Trabajo, el 23 de febrero de 1902: «Veinte años ha que ustedes trabajan para engordar a los verdugos y hasta hoy no ha habido un hombre en el Congreso capaz de hacer cesar este estado de cosas. La experiencia de los años debe marcar para ustedes una nueva conducta para el porvenir. Nunca más al servicio de los amos, de los patrones, de los ricos. Trabajemos, pero para nosotros. La huelga iniciada ahí es el primer paso, ya no es posible retroceder, la marcha está emprendida, debe llegarse hasta el fin de la jornada». Considerando el contexto histórico en que fue escrita esta carta, ¿por qué las autoridades de la época se oponían a estas ideas?",
    options: ["Porque incitaban a la alteración del orden establecido.", "Porque promovían el pensamiento liberal entre los obreros.", "Porque favorecían a los candidatos de oposición al gobierno.", "Porque fomentaban el nacionalismo en los sectores populares."],
    explanation: "Las autoridades de la época veían en el discurso obrero un llamado a alterar el orden social y político establecido." },
  { id: "q32", eje: "Historia de Chile", dificultad: "dificil", correct: 1,
    question: "La riqueza salitrera trajo a Chile un aumento de los ingresos fiscales y también bonanza para un grupo de la población que se enriqueció con esta actividad. Al respecto, ¿de qué forma se evidenció esta situación en la realidad de la elite de la época?",
    options: ["En la renuncia a la posesión de sus tierras.", "En la construcción de palacios de estilo europeo.", "En el abandono de los centros urbanos históricos.", "En la creación de organizaciones de ayuda mutua."],
    explanation: "La riqueza generada por el salitre se evidenció, entre otras cosas, en la construcción de palacios y mansiones de estilo europeo por parte de la elite." },
  { id: "q35", eje: "Historia Universal", dificultad: "dificil", correct: 0,
    question: "Como consecuencia de la crisis ocasionada por la Gran Depresión surgieron nuevos modelos económicos en Europa y América Latina aplicados a escala nacional, los cuales modificaron la realidad socioeconómica entre las décadas de 1930 y 1950. ¿Cuál fue una característica común de estos modelos en ambos continentes durante dicho periodo?",
    options: ["La implementación de estrategias de desarrollo industrial.", "La eliminación de las barreras arancelarias a las importaciones.", "La fijación de un sistema de gestión centralizada de la producción.", "La instauración de políticas de integración en mercados regionales."],
    explanation: "Tras la Gran Depresión, tanto en Europa como en América Latina se impulsaron estrategias de desarrollo industrial como respuesta a la crisis." },
  { id: "q36", eje: "Historia Universal", dificultad: "dificil", correct: 0,
    question: "Lee el siguiente texto sobre el fascismo: «Hay que reconocer, sin embargo, que el fascismo presentaba algunas importantes ventajas para el capital que no tenían otros regímenes. En primer lugar, eliminó o venció a la revolución social izquierdista y pareció convertirse en el principal bastión contra ella». Hobsbawm, E. (1996). Historia del siglo XX. El fascismo fue una ideología que tuvo su auge en Europa en la primera mitad del siglo XX, ¿qué rasgo característico de dicha ideología se expresa en el párrafo citado?",
    options: ["El impulso a un anticomunismo explícito.", "El rechazo al sistema político de tipo liberal.", "La existencia de un régimen de partido único.", "La preferencia por una economía centralizada."],
    explanation: "El anticomunismo explícito fue uno de los rasgos que hizo del fascismo un régimen atractivo para ciertos sectores frente a la amenaza revolucionaria." },
  { id: "q37", eje: "Historia Universal", dificultad: "dificil", correct: 1,
    question: "Lee el siguiente texto que recoge algunas características de los populismos latinoamericanos de la primera mitad del siglo XX: «Uno de los principales problemas de la región, era la incapacidad de los estados de América Latina para limitar la influencia de actores externos y para dirigir la actividad económica de suerte que promoviera un desarrollo económico de base amplia. […] Así, las elites populistas buscaron controlar al Estado y usarlo para debilitar el poder de la oligarquía local, reestructurar las relaciones económicas externas e intervenir en la economía para superar el modelo». Malloy, J. (Ed.) (1977). Autoritarismo y corporativismo en América Latina: el patrón modal. Considerando el contexto histórico y lo descrito en la cita, ¿cuál fue un planteamiento de los regímenes populistas en el ámbito económico?",
    options: ["Incentivar la apertura de la economía al comercio internacional.", "Priorizar el liderazgo del sector público en la gestión productiva.", "Defender las formas tradicionales de organización de la producción.", "Aplicar estrategias liberales para dinamizar los mercados nacionales."],
    explanation: "Los regímenes populistas latinoamericanos priorizaron el liderazgo del Estado en la gestión productiva para reducir la dependencia externa." },
  { id: "q40", eje: "Historia Universal", dificultad: "dificil", correct: 3,
    question: "El populismo se desarrolló en América Latina a partir de la primera mitad del siglo XX, con ejemplos como la administración de Juan Domingo Perón en Argentina y la de Getulio Vargas en Brasil. Respecto de su implementación, ¿cuál fue uno de los factores que favorecieron el surgimiento de estos regímenes en las décadas de 1940 y 1950?",
    options: ["La creación de un modelo de desarrollo hacia afuera.", "La masificación de diversos movimientos guerrilleros.", "El desprestigio de las dictaduras militares de derecha.", "El descrédito de los representantes de la clase política."],
    explanation: "El desprestigio de la clase política tradicional abrió espacio para el surgimiento de liderazgos populistas como los de Perón y Vargas." },
  { id: "q42", eje: "Historia Universal", dificultad: "dificil", correct: 1,
    question: "Lee el siguiente texto que recoge algunas ideas defendidas por el nazismo durante la primera mitad del siglo XX: «El Estado no es un fin en sí mismo, sino un medio. El Estado condiciona el desarrollo de una civilización humana superior, pero no es la causa directa. Aquella reside esencialmente en la existencia de una raza apta para la civilización. Nosotros, los nacionalsocialistas, debemos establecer una distinción bien marcada entre el Estado, que es el continente, y la raza, que es el contenido. El continente no tiene razón de ser si no es capaz de conservar y de preservar su contenido». Hitler, A. (1924). Mi Lucha. Como se citó en Prats, J. (1996). Historia del Mundo Contemporáneo. Considerando la trayectoria del régimen nazi que gobernó Alemania entre 1933 y 1945, ¿cuál fue una acción del régimen basada en las ideas contenidas en el texto?",
    options: ["La implementación de una política de Estado antiparlamentarista.", "La persecución del Estado a determinados grupos minoritarios.", "La puesta en marcha de una policía secreta por parte del Estado.", "La reunificación territorial para reconstruir el Estado fragmentado."],
    explanation: "Coherente con su ideología racial, el régimen nazi llevó a la práctica la persecución sistemática de grupos minoritarios." },
  { id: "q43", eje: "Historia Universal", dificultad: "dificil", correct: 3,
    question: "Tras el término de la Segunda Guerra Mundial en 1945, Estados Unidos asumió un nuevo rol en el escenario geopolítico internacional, el cual se manifestó de distintas maneras, entre las que se cuenta la implementación del Plan Marshall. ¿Cuál fue uno de los mecanismos de este plan que contribuyó a fortalecer la posición hegemónica de Estados Unidos a escala mundial?",
    options: ["La desmilitarización de los territorios de la esfera soviética.", "El financiamiento de dictaduras militares en América Latina.", "El fomento a la descolonización de diversas naciones africanas.", "La entrega de créditos a países europeos devastados por el conflicto."],
    explanation: "El Plan Marshall entregó créditos a los países europeos devastados por la guerra, fortaleciendo con ello la influencia estadounidense en la región." },
  { id: "q45", eje: "Historia Universal", dificultad: "dificil", correct: 1,
    question: "Lee el siguiente extracto del discurso del presidente de Estados Unidos en 1947: «Uno de los objetivos fundamentales de la política exterior de Estados Unidos es la creación de condiciones en las cuales nosotros y otras naciones podamos forjar una manera de vivir libre de coacción. […] Sin embargo, no alcanzaremos nuestros objetivos a menos que estemos dispuestos a ayudar a los pueblos libres a preservar sus instituciones libres y su integridad nacional frente a los movimientos agresivos que tratan de imponerles regímenes totalitarios». Truman, H. (1947). Discurso del presidente Truman ante el Congreso de los Estados Unidos [Discurso principal]. A partir del texto citado y considerando el contexto de la época, ¿cuál fue la postura de Estados Unidos en el proceso de configuración del nuevo orden internacional de posguerra?",
    options: ["La conciliación ideológica con los países bajo el poderío soviético.", "El respeto por la autodeterminación de los países a escala mundial.", "El control de la organización que regulaba las relaciones entre los países.", "La eliminación de las divisiones territoriales existentes entre países afines."],
    explanation: "Truman planteó que Estados Unidos debía apoyar a los pueblos libres a preservar su autodeterminación frente al avance de regímenes totalitarios." },
  { id: "q46", eje: "Historia Universal", dificultad: "dificil", correct: 2,
    question: "La Segunda Guerra Mundial debilitó económica y políticamente a algunas potencias coloniales europeas, provocando una reconfiguración del escenario geopolítico internacional. En este contexto, ¿qué consecuencia política provocó el término de este conflicto bélico en Asia?",
    options: ["La integración de un bloque político continental para equilibrar el poder con Occidente.", "La caída de los regímenes comunistas que existían en la región para adoptar el capitalismo.", "La movilización de las naciones dominadas para acelerar sus procesos de independencia.", "La expansión del fascismo en los países de Oriente para combatir la democracia liberal."],
    explanation: "El debilitamiento de las potencias coloniales tras la guerra aceleró los procesos de independencia de las naciones dominadas en Asia." },
  { id: "q47", eje: "Historia de Chile", dificultad: "dificil", correct: 2,
    question: "Lee el siguiente texto que caracteriza a la sociedad chilena de mediados del siglo XX: «La década de los cincuenta fue una época de gran crecimiento poblacional. La población que en 1950 alcanzaba los 5,9 millones, en 1960 había trepado a los 7,4 millones. Además, se convirtió en una sociedad fuertemente urbana […]. Conservaba, sin embargo, un esquema tradicional de estratificación: la clase alta representaba alrededor de un 10 %, la clase media constituía un 15 % y el 75 % restante lo conformaba la clase baja». Fazio, H. (2004). La globalización en Chile: entre el Estado y la sociedad de mercado. En la sociedad de la época, ¿qué efecto provocó la situación descrita en el texto?",
    options: ["La reubicación estatal de la población en la periferia.", "La falta de espacio para la construcción de viviendas.", "La agudización del déficit habitacional en las ciudades.", "La decadencia de los sistemas de subsidio a la vivienda."],
    explanation: "El fuerte crecimiento poblacional y la urbanización acelerada de mediados del siglo XX agudizaron el déficit habitacional en las ciudades chilenas." },
  { id: "q48", eje: "Historia de Chile", dificultad: "dificil", correct: 3,
    question: "Lee el siguiente texto relacionado con las condiciones laborales en el medio rural hacia mediados del siglo XX en Chile: «Soy casada y madre de cuatro hijos chicos, mi marido hace dos años está empleado en este fundo […]. Mi marido fue ayer a presentarse a la Oficina del Trabajo y el patrón amenaza que nada le servirá porque en la oficina de la Caja hay un pariente de él. […] Este señor comete cosas contrarias a las leyes. Tiene la mitad de los trabajadores sin inscribir en el Seguro Obligatorio […]. Si ustedes pudieran mandar a un empleado que no se viniera a dar las manos al patrón y registraran los libros de los que tiene asegurados, no hallarán ni la mitad». Garrido, M. (1940). [Carta al Instituto de Información Campesina]. De acuerdo con lo planteado en el texto y considerando el contexto histórico, ¿cuál fue un factor que contribuyó a agudizar la precariedad de las condiciones de vida?",

  { id: "q50", eje: "Historia de Chile", dificultad: "dificil", correct: 0,

  { id: "q52", eje: "Historia de Chile", dificultad: "dificil", correct: 2,
    question: "Lee el siguiente texto que se refiere al quiebre de la democracia en Chile en 1973: «La diferencia esencial es que ocurría en la época de la política moderna y de masas, en la época –sin ir más lejos– de los medios de comunicación masivos, con lo cual difícilmente había alguien en el país que no se viera afectado o ignorara lo que estaba ocurriendo. Las familias estaban divididas; antiguas amistades habían llegado a un punto de ruptura; todo el mundo perdía la cabeza. Hubo un momento en que muchas de las virtudes chilenas tradicionales, especialmente la virtud de la convivencia, esa capacidad para respetar puntos de vista diferentes, parecían totalmente en retroceso». Collier, S. et al. (1998). Historia de Chile, 1808-1994. De acuerdo con el texto, ¿cuál fue una de las causas del quiebre de la democracia?",

  { id: "q53", eje: "Historia de Chile", dificultad: "dificil", correct: 1,

  { id: "q56", eje: "Historia de Chile", dificultad: "dificil", correct: 3,

  { id: "q60", eje: "Economía", dificultad: "dificil", correct: 2,

  { id: "q63", eje: "Economía", dificultad: "dificil", correct: 3,

  { id: "q64", eje: "Economía", dificultad: "dificil", correct: 1,

    explanation: "La Contraloría fiscaliza la legalidad de los actos administrativos; las otras opciones confunden esa función con atribuciones que corresponden al Congreso, al Ejecutivo o a los propios municipios." },
  { id: "o14", eje: "Formación Ciudadana", correct: 0, dificultad: "dificil",
    question: "Un plebiscito y una elección parlamentaria son ambos mecanismos de participación electoral regulados por el mismo padrón y la misma institucionalidad electoral chilena. Sin embargo, ¿en qué se diferencia principalmente el plebiscito de una elección parlamentaria?",
    options: ["Consulta a la ciudadanía sobre una materia específica, en vez de elegir representantes", "Permite votar únicamente a quienes ya participaron en elecciones parlamentarias previas", "Se convoca exclusivamente a nivel municipal dentro del sistema chileno", "Se rige por un padrón electoral distinto al utilizado en las elecciones parlamentarias"],
    explanation: "La diferencia central es el objeto de la votación (una materia puntual, no representantes); ambos instrumentos comparten el mismo padrón electoral y ninguno restringe el voto según participación previa." },
  { id: "o15", eje: "Formación Ciudadana", correct: 2, dificultad: "dificil",
    question: "Los derechos humanos suelen clasificarse en generaciones según su origen histórico: los de 'primera generación' (civiles y políticos) surgieron con las revoluciones liberales de los siglos XVIII y XIX. ¿Cuál es una característica de los derechos de 'segunda generación', surgidos posteriormente?",
    options: ["Se limitan a las libertades individuales de expresión y reunión, igual que los de primera generación", "Surgieron cronológicamente antes que los derechos civiles y políticos de primera generación", "Están orientados a garantizar derechos económicos, sociales y culturales, exigiendo un rol activo del Estado", "No requieren ningún tipo de acción del Estado para hacerse efectivos"],
    explanation: "Los derechos de segunda generación (educación, salud, trabajo) surgieron después de los civiles y políticos, y a diferencia de estos, exigen un rol activo del Estado — no son solo libertades individuales ni se ejercen sin intervención estatal." },
  { id: "o16", eje: "Formación Ciudadana", correct: 3, dificultad: "dificil",
    question: "A diferencia del Poder Judicial, que resuelve conflictos aplicando la ley, o del Poder Ejecutivo, que administra el Estado, los partidos políticos ocupan un lugar distinto dentro del entramado institucional de una democracia representativa. ¿Cuál es una función central que cumplen estas organizaciones?",
    options: ["Reemplazar al Poder Judicial en la resolución de conflictos legales entre privados", "Administrar de forma directa los recursos fiscales asignados al Estado", "Determinar unilateralmente, al margen de la ciudadanía, el resultado de los procesos electorales", "Canalizar y representar los intereses de distintos sectores de la ciudadanía ante el Estado"],
    explanation: "Los partidos políticos median entre ciudadanía e instituciones estatales, representando intereses; no cumplen funciones judiciales, administrativas ni definen resultados electorales al margen de la votación ciudadana." },
  { id: "o17", eje: "Formación Ciudadana", correct: 1, dificultad: "dificil",
    question: "El concepto de 'sociedad civil' se utiliza frecuentemente en el análisis de los sistemas democráticos, en contraste con el aparato estatal y con el mercado, dos esferas que operan bajo lógicas distintas a las de este tercer sector. ¿A qué hace referencia este concepto?",
    options: ["Al conjunto de instituciones que forman parte directa del aparato estatal", "Al conjunto de organizaciones y ciudadanos que actúan al margen del Estado y del mercado", "Al sistema de partidos políticos con representación parlamentaria vigente", "A las Fuerzas Armadas, en su rol de garantes del orden institucional del Estado"],
    explanation: "La sociedad civil agrupa organizaciones (ONG, sindicatos, juntas de vecinos) independientes tanto del Estado como del mercado — a diferencia de instituciones estatales, partidos con representación o las Fuerzas Armadas, que sí forman parte del aparato estatal." },
  { id: "o18", eje: "Formación Ciudadana", correct: 0, dificultad: "dificil",
    question: "A diferencia del Servicio Electoral, que administra los procesos electorales, o del Congreso, que redacta y aprueba reformas constitucionales, el Tribunal Constitucional cumple un rol específico dentro del sistema institucional chileno. ¿Cuál es una de sus principales atribuciones?",
    options: ["Resolver conflictos sobre la constitucionalidad de las leyes y proyectos de ley", "Supervisar directamente el desarrollo de los procesos electorales del país", "Proponer y redactar por iniciativa propia reformas constitucionales al Congreso", "Fiscalizar el gasto presupuestario específico de los gobiernos regionales"],
    explanation: "El Tribunal Constitucional revisa la constitucionalidad de normas; administrar elecciones, redactar reformas o fiscalizar presupuestos regionales corresponden a otras instituciones (Servicio Electoral, Congreso, Contraloría)." },

  { id: "o19", eje: "Economía", correct: 2, dificultad: "dificil",
    question: "El Banco Central de Chile puede subir o bajar la tasa de interés de política monetaria según el objetivo de controlar la inflación, entendiendo que esta tasa influye en el costo del crédito para hogares y empresas, no en el tipo de cambio de forma directa e inmediata. ¿Qué efecto se espera si el Banco Central sube esta tasa en un contexto de alta inflación?",
    options: ["Un aumento en el consumo y la inversión de los hogares, por el mayor costo del crédito", "Una mayor disposición de los bancos a otorgar créditos a tasas más bajas", "Un desincentivo al consumo, derivado del encarecimiento del crédito, que ayuda a contener la inflación", "Una reducción inmediata y directa del tipo de cambio internacional del país"],
    explanation: "Subir la tasa encarece el crédito y desincentiva el consumo, moderando la inflación — el efecto principal opera sobre el consumo/crédito, no de forma directa e inmediata sobre el tipo de cambio, y ciertamente no facilita más créditos baratos." },
  { id: "o20", eje: "Economía", correct: 1, dificultad: "dificil",
    question: "Los sistemas económicos pueden clasificarse según cómo se resuelven las preguntas básicas de qué, cómo y para quién producir, existiendo modelos que van desde la planificación estatal total hasta el libre mercado sin regulación. ¿Qué caracteriza a un sistema de economía mixta, situado entre esos dos extremos?",
    options: ["La ausencia de cualquier forma de propiedad privada sobre los medios de producción", "La combinación de mecanismos de mercado con distintos grados de intervención estatal", "La planificación centralizada de toda la producción nacional por parte del Estado", "La inexistencia total de regulación estatal sobre la actividad económica"],
    explanation: "La economía mixta combina mercado e intervención estatal en grados variables — no elimina la propiedad privada ni la regulación, ni tampoco planifica de forma centralizada toda la producción como en un extremo puro." },
  { id: "o21", eje: "Economía", correct: 0, dificultad: "dificil",
    question: "La balanza comercial de un país registra la diferencia entre el valor de sus exportaciones y sus importaciones en un período determinado, siendo un indicador distinto del tipo de cambio, aunque ambos suelen mencionarse juntos en el análisis del sector externo. ¿Qué significa que un país tenga superávit comercial?",
    options: ["Que sus exportaciones superan en valor a sus importaciones en ese período", "Que su moneda se ha depreciado frente al dólar durante ese mismo período", "Que ha reducido su volumen total de comercio exterior respecto de años anteriores", "Que sus importaciones superan en valor a sus exportaciones en ese período"],
    explanation: "El superávit comercial es, por definición, que las exportaciones superan a las importaciones en valor; no describe el nivel del tipo de cambio ni una reducción del volumen comercial, que son fenómenos distintos." },
  { id: "o22", eje: "Economía", correct: 3, dificultad: "dificil",
    question: "Uno de los objetivos centrales del Banco Central de Chile es mantener la estabilidad de precios, tarea que se distingue de otras funciones económicas como la política fiscal (a cargo del gobierno) o la fijación del tipo de cambio (que en Chile es flotante, no fijo). ¿Por qué es relevante este objetivo de estabilidad de precios para la economía?",
    options: ["Porque reemplaza por completo la necesidad de una política fiscal activa del gobierno", "Porque garantiza de forma automática niveles bajos de desempleo en la economía", "Porque fija de forma permanente el tipo de cambio del país frente al dólar", "Porque una inflación controlada facilita la planificación económica de hogares y empresas"],
    explanation: "La estabilidad de precios ayuda a planificar mejor consumo, ahorro e inversión; no reemplaza la política fiscal, no garantiza automáticamente pleno empleo, y Chile mantiene un tipo de cambio flotante, no fijo." },
  { id: "o23", eje: "Economía", correct: 2, dificultad: "dificil",
    question: "Los impuestos pueden clasificarse en directos (que gravan renta o patrimonio según la capacidad económica de la persona) e indirectos (que gravan el consumo, independientemente del ingreso de quien compra). ¿Cuál de los siguientes es un ejemplo de impuesto indirecto en Chile?",
    options: ["El Impuesto a la Renta de las personas naturales, que considera el nivel de ingreso", "El impuesto territorial que grava los bienes raíces según su avalúo", "El IVA (Impuesto al Valor Agregado), aplicado al consumo de bienes y servicios", "El impuesto que grava las herencias y donaciones según su monto"],
    explanation: "El IVA grava el consumo por igual, sin considerar el ingreso del comprador, lo que lo hace indirecto; las otras tres opciones sí consideran renta, patrimonio o monto heredado, siendo impuestos directos." },
  { id: "o24", eje: "Economía", correct: 1, dificultad: "dificil",
    question: "El desempleo puede clasificarse según su causa en friccional (búsqueda temporal de empleo), estacional (varía según la época del año), cíclico (asociado a recesiones) y estructural. ¿Qué caracteriza específicamente al desempleo de tipo estructural?",
    options: ["Se debe a la búsqueda temporal de un nuevo empleo tras dejar uno anterior", "Surge por un desajuste entre las habilidades de los trabajadores y las necesidades del mercado laboral", "Ocurre en rubros cuya demanda de trabajo varía según la temporada del año", "Se origina exclusivamente por una caída generalizada del gasto durante una recesión"],
    explanation: "El desempleo estructural surge por un desajuste de competencias (por ejemplo, cambios tecnológicos), distinto del friccional (búsqueda temporal), el estacional (variación por temporada) o el cíclico (asociado a recesiones)." },

  { id: "o25", eje: "Historia de Chile", correct: 1, dificultad: "dificil",
    question: "La Constitución de 1833, impulsada por Diego Portales, ordenó políticamente a Chile durante casi un siglo, en contraste con la inestabilidad institucional que había caracterizado la década previa de ensayos constitucionales. ¿Cuál fue una de sus características centrales?",
    options: ["Estableció un régimen parlamentario con un Congreso dominante sobre el Ejecutivo", "Consagró un presidencialismo fuerte y de carácter autoritario", "Redujo significativamente las atribuciones del Presidente de la República respecto de ensayos previos", "Otorgó amplia autonomía política a las provincias frente al poder central"],
    explanation: "La Constitución de 1833 concentró amplias atribuciones en el Presidente, generando un modelo autoritario-presidencialista y centralizado — justo lo opuesto a un régimen parlamentario, a reducir el poder presidencial o a dar autonomía provincial." },
  { id: "o26", eje: "Historia de Chile", correct: 3, dificultad: "dificil",
    question: "Hacia fines del siglo XIX y comienzos del XX, en Chile emergió con fuerza la llamada 'Cuestión Social', en paralelo al auge salitrero y a la migración masiva de trabajadores hacia los centros mineros y urbanos. ¿A qué problemática hacía referencia específicamente este concepto?",
    options: ["Al conflicto limítrofe pendiente con Perú y Bolivia tras la Guerra del Pacífico", "A la crisis de representatividad de los partidos políticos durante el parlamentarismo", "Al debate legislativo en torno a la separación de la Iglesia y el Estado", "A las precarias condiciones de vivienda, salud y trabajo de la población urbana y obrera"],
    explanation: "La Cuestión Social apuntaba a las condiciones de vida de la población obrera y urbana (hacinamiento, insalubridad, explotación laboral), un fenómeno social y económico, distinto de los conflictos limítrofes, la crisis de representatividad política o el debate Iglesia-Estado." },
  { id: "o27", eje: "Historia de Chile", correct: 0, dificultad: "dificil",
    question: "La Constitución de 1925 puso fin al período parlamentario en Chile, revirtiendo el esquema en que el Congreso y sus gabinetes dependientes habían concentrado buena parte del poder político desde 1891. ¿Qué cambio institucional introdujo respecto del sistema vigente hasta entonces?",
    options: ["Restableció un régimen presidencialista fuerte, devolviendo atribuciones al Ejecutivo", "Amplió aún más las atribuciones fiscalizadoras del Congreso sobre el gabinete ministerial", "Mantuvo el sistema de gabinetes responsables ante el Parlamento vigente desde 1891", "Trasladó buena parte del poder ejecutivo hacia los gobiernos provinciales"],
    explanation: "La Constitución de 1925 devolvió atribuciones al Presidente, terminando —no ampliando ni manteniendo— el sistema de gabinetes dependientes del Congreso propio del parlamentarismo, y sin descentralizar el poder hacia las provincias." },
  { id: "o28", eje: "Historia de Chile", correct: 2, dificultad: "dificil",
    question: "Las Protestas Nacionales de 1983 marcaron un punto de inflexión en la oposición a la dictadura militar chilena, ocurridas en un momento en que los partidos políticos aún no tenían reconocimiento legal para operar abiertamente. ¿Qué factor contribuyó principalmente a su surgimiento?",
    options: ["Un período de fuerte crecimiento económico y baja cesantía a inicios de los años 80", "Un acuerdo previo entre el régimen militar y los partidos de oposición para convocarlas", "La crisis económica y el descontento social crecientes de comienzos de esa década", "La reincorporación previa de los partidos políticos a la actividad legal reconocida"],
    explanation: "Fue la crisis económica de inicios de los 80, no la bonanza, un acuerdo con el régimen ni la legalización previa de los partidos (que aún no ocurría), lo que impulsó estas movilizaciones sociales masivas." },
  { id: "o29", eje: "Historia de Chile", correct: 1, dificultad: "dificil",
    question: "La Guerra contra la Confederación Perú-Boliviana (1836-1839) enfrentó a Chile con esa alianza binacional, que representaba entonces un competidor comercial y naval en el Pacífico sudamericano. ¿Qué consecuencia tuvo el resultado de esta guerra para Chile?",
    options: ["La pérdida temporal de su acceso al océano Pacífico durante el conflicto", "El fortalecimiento de su posición geopolítica y comercial en el Pacífico sudamericano", "La incorporación inmediata de territorio boliviano al territorio chileno", "El quiebre definitivo y permanente de las relaciones comerciales con Perú"],
    explanation: "La victoria chilena disolvió la Confederación y consolidó a Chile como potencia comercial y naval regional, sin anexión territorial inmediata ni ruptura comercial permanente con Perú — y por supuesto sin perder su propio acceso al Pacífico." },

  { id: "o30", eje: "Historia Universal", correct: 2, dificultad: "dificil",
    question: "La unificación de Alemania (1864-1871) fue liderada por Prusia bajo el canciller Otto von Bismarck, en un proceso que incluyó tres guerras sucesivas (contra Dinamarca, Austria y Francia) además de intensa actividad diplomática. ¿Qué estrategia caracterizó principalmente este proceso?",
    options: ["La negociación exclusivamente pacífica con las demás potencias europeas", "La disolución progresiva y voluntaria de los reinos alemanes existentes, sin intervención prusiana", "El uso combinado de la diplomacia y la fuerza militar, conocido como 'realpolitik'", "La mediación de Francia como garante externo del proceso de unificación"],
    explanation: "Bismarck combinó diplomacia calculada con conflictos bélicos (no negociación exclusivamente pacífica, ni disolución voluntaria sin intervención, ni mediación francesa: Francia fue, de hecho, una de las potencias derrotadas en el proceso)." },
  { id: "o32", eje: "Historia Universal", correct: 3, dificultad: "dificil",
    question: "La Primera Guerra Mundial (1914-1918) tuvo un fuerte impacto en el orden político europeo, dejando un continente devastado económica y socialmente, con monarquías tradicionales que no lograron sobrevivir al conflicto (como en Rusia, Alemania y el Imperio Austrohúngaro). ¿Qué efecto tuvo este conflicto sobre el liberalismo decimonónico como modelo hegemónico?",
    options: ["Lo consolidó como el único sistema político viable en la Europa de posguerra", "Aceleró su expansión pacífica hacia nuevas regiones del continente europeo", "Fortaleció principalmente a las monarquías tradicionales que gobernaban antes del conflicto", "Contribuyó a debilitarlo, abriendo paso a nuevas ideologías como el fascismo y el comunismo"],
    explanation: "La devastación de la guerra deslegitimó al liberalismo tradicional y favoreció ideologías alternativas, mientras que varias monarquías tradicionales colapsaron durante o después del conflicto, en vez de fortalecerse." },
  { id: "o33", eje: "Historia Universal", correct: 1, dificultad: "dificil",
    question: "En 1945, tras el fin de la Segunda Guerra Mundial, se fundó la Organización de las Naciones Unidas (ONU) como sucesora de la fallida Sociedad de Naciones de entreguerras, buscando corregir las limitaciones de ese organismo previo. ¿Cuál fue el propósito principal de su creación?",
    options: ["Consolidar el dominio militar de las potencias vencedoras sobre el resto del mundo", "Regular las relaciones internacionales y prevenir nuevos conflictos de alcance global", "Reemplazar a los gobiernos nacionales en la toma de decisiones internas de cada país", "Establecer un único ejército multinacional permanente bajo mando centralizado"],
    explanation: "La ONU buscó fomentar la cooperación internacional y prevenir conflictos globales, sin reemplazar la soberanía de los Estados miembros ni consolidar el dominio militar de las potencias vencedoras como objetivo declarado." },
  { id: "o34", eje: "Historia Universal", correct: 0, dificultad: "dificil",
    question: "En 1948, la ONU adoptó la Declaración Universal de los Derechos Humanos, en un contexto marcado por las atrocidades recién vividas durante la Segunda Guerra Mundial. A diferencia de un tratado comercial o de una constitución nacional, ¿qué importancia histórica tuvo este documento?",
    options: ["Estableció un marco común de derechos básicos aplicables a toda la humanidad", "Sustituyó formalmente las constituciones nacionales de los países firmantes", "Reguló de manera específica las relaciones comerciales entre los bloques de posguerra", "Tuvo aplicación jurídica vinculante exclusivamente dentro de Europa occidental"],
    explanation: "La Declaración se convirtió en un referente ético y jurídico universal, sin sustituir constituciones nacionales, sin regular comercio, y sin limitarse geográficamente a Europa occidental." },
  { id: "o35", eje: "Historia Universal", correct: 3, dificultad: "dificil",
    question: "La Revolución Cubana de 1959, liderada por Fidel Castro, derivó en la ruptura de relaciones diplomáticas entre Cuba y Estados Unidos y en un giro hacia el bloque soviético durante la Guerra Fría. ¿Cuál fue uno de sus efectos en el resto de América Latina?",
    options: ["La pérdida de vigencia de los movimientos de izquierda ya existentes en la región", "El fortalecimiento generalizado de los gobiernos liberales de tendencia pro estadounidense", "Un rápido y sostenido acercamiento diplomático entre Cuba y Estados Unidos en la década siguiente", "Convertirse en un referente e impulso para movimientos de izquierda en la región"],
    explanation: "El triunfo cubano inspiró a movimientos de izquierda latinoamericanos, en vez de debilitarlos, y llevó a una ruptura -no un acercamiento- con Estados Unidos, sin fortalecer a los gobiernos liberales pro estadounidenses de la región." },
  { id: "o36", eje: "Historia Universal", correct: 1, dificultad: "dificil",
    question: "La Crisis de los Misiles de Cuba (1962), considerada el momento de mayor tensión de la Guerra Fría, ocurrió apenas un año después del fallido desembarco de Bahía de Cochinos (1961), organizado por Estados Unidos contra el gobierno cubano. ¿Qué originó específicamente la crisis de 1962?",
    options: ["Un nuevo desembarco militar estadounidense, esta vez exitoso, en territorio cubano", "El despliegue de misiles nucleares soviéticos en territorio cubano", "La ruptura de relaciones diplomáticas entre la URSS y la República Popular China", "Un acuerdo comercial secreto suscrito entre Cuba y Estados Unidos en esos años"],
    explanation: "La crisis de 1962 se originó por el despliegue de misiles soviéticos en Cuba, no por un nuevo desembarco militar exitoso (a diferencia del fallido intento de 1961), ni por asuntos entre la URSS y China, ni por ningún acuerdo con EE.UU." },
  { id: "o37", eje: "Historia Universal", correct: 2, dificultad: "dificil",
    question: "El golpe de Estado en Brasil (1964), que instauró una dictadura militar prolongada en ese país, antecedió en varios años a golpes similares en Chile (1973), Uruguay (1973) y Argentina (1976). ¿Qué fenómeno regional ejemplifica mejor esta secuencia de eventos?",
    options: ["El fortalecimiento generalizado y sostenido de las democracias latinoamericanas de la época", "Un caso aislado, sin relación con otros procesos políticos ocurridos en la región", "La ola de regímenes autoritarios instaurados en América Latina durante la Guerra Fría", "El fin de la influencia política y económica de Estados Unidos sobre el continente"],
    explanation: "El golpe brasileño fue el primero de una secuencia regional de dictaduras militares durante la Guerra Fría, no un hecho aislado, y ocurrió en un contexto de fuerte influencia (no de retirada) de Estados Unidos en la región." },
  { id: "o38", eje: "Historia Universal", correct: 3, dificultad: "dificil",
    question: "En 1991 se disolvió formalmente la Unión Soviética, poniendo fin a casi 45 años de confrontación bipolar con Estados Unidos que habían definido el orden internacional desde 1947. ¿Qué consecuencia tuvo este acontecimiento en el orden mundial posterior?",
    options: ["El fortalecimiento del bloque comunista a escala global durante la década de 1990", "La creación de un nuevo bloque militar en Europa del Este como contrapeso a Occidente", "El recrudecimiento de la confrontación ideológica propia de la Guerra Fría", "El fin definitivo de la Guerra Fría y el auge del neoliberalismo y la globalización"],
    explanation: "Con la desaparición de la URSS terminó -no se recrudeció- la confrontación bipolar, consolidándose Estados Unidos como potencia hegemónica y expandiéndose el modelo neoliberal, en vez de surgir un nuevo bloque militar rival en la región." }

  { id: "h1", eje: "Historia de Chile", dificultad: "dificil", correct: 2,
    question: "Durante el ciclo del salitre (1880-1930), el Estado chileno financió gran parte de su presupuesto con los impuestos a la exportación de este mineral, sin desarrollar de forma paralela una industria manufacturera propia significativa. ¿Qué concepto describe mejor esta situación económica?",
    options: ["Un modelo de sustitución de importaciones consolidado", "Una diversificación productiva orientada al mercado interno", "Una dependencia estructural de las exportaciones de un solo recurso primario", "Una política de proteccionismo industrial exitosa"],
    explanation: "La economía chilena de la época dependía casi exclusivamente de un producto de exportación (monoexportación), sin desarrollar una base industrial diversificada — patrón típico de las economías primario-exportadoras de la época." },
  { id: "h2", eje: "Historia de Chile", dificultad: "dificil", correct: 1,
    question: "El régimen parlamentario chileno (1891-1925) ha sido descrito por parte de la historiografía como un período de 'inestabilidad política a pesar del crecimiento económico'. ¿Qué explica mejor esta aparente contradicción?",
    options: ["La ausencia total de recursos fiscales durante el período", "La rotación constante de gabinetes ministeriales pese a la bonanza salitrera", "El fortalecimiento excesivo del Poder Ejecutivo sobre el Congreso", "La inexistencia de partidos políticos organizados en esos años"],
    explanation: "Pese a los altos ingresos fiscales del salitre, el predominio del Congreso generó una alta rotación de gabinetes, dificultando la gobernabilidad — la bonanza económica no se tradujo en estabilidad política." },
  { id: "h3", eje: "Historia de Chile", dificultad: "dificil", correct: 3,
    question: "Algunos historiadores sostienen que la Reforma Agraria chilena (1962-1973) no solo tuvo un objetivo redistributivo, sino también uno de modernización productiva del campo. ¿Qué evidencia respaldaría esta segunda dimensión del proceso?",
    options: ["La eliminación completa de la producción agrícola de exportación", "El traspaso de tierras exclusivamente a manos del Estado sin intervención campesina", "La prohibición legal de cualquier forma de propiedad agrícola privada", "La creación de cooperativas y asentamientos orientados a mejorar la productividad rural"],
    explanation: "Además de expropiar y redistribuir tierras, la reforma buscó modernizar la producción agrícola mediante asentamientos y cooperativas que introdujeran mejores técnicas y organización del trabajo rural." },

  { id: "h4", eje: "Historia Universal", dificultad: "dificil", correct: 0,
    question: "El historiador Eric Hobsbawm caracterizó al período 1914-1945 como parte de una 'guerra civil europea' de larga duración, más que como dos conflictos separados. ¿Qué elemento respalda mejor esta interpretación?",
    options: ["La continuidad de tensiones territoriales e ideológicas no resueltas entre ambas guerras", "El hecho de que ambas guerras tuvieron exactamente los mismos países beligerantes", "La ausencia total de cambios en el mapa político europeo entre 1918 y 1939", "La firma de un tratado de paz definitivo que impidió cualquier nuevo conflicto"],

  { id: "h6", eje: "Historia Universal", dificultad: "dificil", correct: 1,

import {

const firebaseConfig = {

let currentUser = null;

function userDocRef(uid) { return doc(db, 'users', uid); }
function historyColRef(uid) { return collection(db, 'users', uid, 'history'); }

const STORAGE_KEY = "paes_historia_progress_v3";

const CATEGORY_COLORS = {
  "Historia de Chile": "#1c8fcb",
